matrix:
- name: python
  sources:
  - parmoo/**/*.py
  - examples/**/*.py
  - "*.py"
  aspell:
    lang: en
    d: en_US
  pipeline:
  - pyspelling.filters.python:
      strings: false
  dictionary:
    wordlists:
    - .github/config/custom-wordlist.txt
- name: rst
  sources:
  - docs/**/*.rst  
  - "*.rst"
  aspell:
    lang: en
    d: en_US
  dictionary:
    wordlists:
    - .github/config/custom-wordlist.txt
